name: Build Android App

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      # 1. Descargar el código del repositorio
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Configurar Java (JDK 17 es el estándar actual para Android)
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # 3. Configurar el SDK de Android (con los paquetes limpios y sin 'tools')
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3
        with:
          cmdline-tools-version: "12266719"
          accept-android-sdk-licenses: true
          packages: |
            platform-tools
            build-tools;34.0.0
            platforms;android-34

      # 4. Dar permisos de ejecución a Gradle (si aplica)
      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew || true

      # 5. Compilar la aplicación (ejemplo con Gradle para generar el APK de depuración)
      - name: Build with Gradle
        run: ./gradlew assembleDebug
